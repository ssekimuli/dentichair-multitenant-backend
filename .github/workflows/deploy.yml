name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy Laravel App to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /home/poslycloud-dentalapi/htdocs/dentalapi.poslycloud.com
            
            # Fetch and reset to match the remote master branch
            git fetch origin master
            git reset --hard origin/master
            
            # Ensure correct file permissions for Laravel directories
            chgrp -R www-data storage bootstrap/cache
            chmod -R ug+rwx storage bootstrap/cache
            
            # Set secure file/directory permissions for safety
            find . -type f -exec chmod 644 {} \;
            find . -type d -exec chmod 755 {} \;
            chmod -R 775 storage bootstrap/cache

            
            # Install PHP dependencies
            composer install --no-dev --optimize-autoloader
            
            # Run database migrations
            php artisan migrate --force
            
            # Cache configuration, routes, and views for optimal performance
            php artisan optimize
            
            # Build frontend assets (Vite / Tailwind) if node is installed and package.json exists
            if [ -f "package.json" ]; then
              if command -v npm &> /dev/null; then
                npm install
                npm run build
              else
                echo "npm is not installed on the server, skipping asset compilation."
              fi
            fi
            
            # Clear OPcache to ensure PHP files are recompiled
            if command -v php-fpm &> /dev/null; then
              sudo systemctl reload php-fpm || echo "PHP-FPM reload failed, might require passwordless sudo setup."
            elif [ -e "/var/run/php/php-fpm.sock" ]; then
              sudo service php-fpm reload || echo "PHP-FPM reload failed."
            fi
