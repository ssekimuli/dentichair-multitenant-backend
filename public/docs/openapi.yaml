  /api/appointments:
    get:
      summary: 'Get All Appointments'
      operationId: getAllAppointments
      description: "Retrieve a list of appointments with optional filtering by branch, date, or status.\nReturns complete appointment details including patient, doctor, and branch information."
      parameters:
        -
          in: query
          name: branch_id
          description: 'Filter appointments by branch ID.'
          example: b1
          required: false
          schema:
            type: string
            description: 'Filter appointments by branch ID.'
            example: b1
            nullable: false
        -
          in: query
          name: date
          description: 'Filter appointments by specific date (YYYY-MM-DD).'
          example: '2024-07-20'
          required: false
          schema:
            type: string
            description: 'Filter appointments by specific date (YYYY-MM-DD).'
            example: '2024-07-20'
            nullable: false
        -
          in: query
          name: status
          description: 'Filter appointments by status.'
          example: Scheduled
          required: false
          schema:
            type: string
            description: 'Filter appointments by status.'
            example: Scheduled
            nullable: false
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: a1
                      patient_name: 'John Doe'
                      patient_id: '1'
                      doctor_name: 'Dr. Lisa Cuddy'
                      doctor_id: emp1
                      treatment: Check-up
                      status: Scheduled
                      date: '2024-07-20'
                      time: '10:00 AM'
                      branch_id: b1
                      token_number: JDLC1
                      patient:
                        id: '1'
                        name: 'John Doe'
                        email: john.doe@example.com
                      doctor:
                        id: emp1
                        name: 'Dr. Lisa Cuddy'
                        role: Dentist
                      branch:
                        id: b1
                        name: 'Downtown Clinic'
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: a1
                        patient_name: 'John Doe'
                        patient_id: '1'
                        doctor_name: 'Dr. Lisa Cuddy'
                        doctor_id: emp1
                        treatment: Check-up
                        status: Scheduled
                        date: '2024-07-20'
                        time: '10:00 AM'
                        branch_id: b1
                        token_number: JDLC1
                        patient:
                          id: '1'
                          name: 'John Doe'
                          email: john.doe@example.com
                        doctor:
                          id: emp1
                          name: 'Dr. Lisa Cuddy'
                          role: Dentist
                        branch:
                          id: b1
                          name: 'Downtown Clinic'
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: a1
                        patient_name:
                          type: string
                          example: 'John Doe'
                        patient_id:
                          type: string
                          example: '1'
                        doctor_name:
                          type: string
                          example: 'Dr. Lisa Cuddy'
                        doctor_id:
                          type: string
                          example: emp1
                        treatment:
                          type: string
                          example: Check-up
                        status:
                          type: string
                          example: Scheduled
                        date:
                          type: string
                          example: '2024-07-20'
                        time:
                          type: string
                          example: '10:00 AM'
                        branch_id:
                          type: string
                          example: b1
                        token_number:
                          type: string
                          example: JDLC1
                        patient:
                          type: object
                          properties:
                            id:
                              type: string
                              example: '1'
                            name:
                              type: string
                              example: 'John Doe'
                            email:
                              type: string
                              example: john.doe@example.com
                        doctor:
                          type: object
                          properties:
                            id:
                              type: string
                              example: emp1
                            name:
                              type: string
                              example: 'Dr. Lisa Cuddy'
                            role:
                              type: string
                              example: Dentist
                        branch:
                          type: object
                          properties:
                            id:
                              type: string
                              example: b1
                            name:
                              type: string
                              example: 'Downtown Clinic'
      tags:
        - Appointments
    post:
      summary: 'Create Appointment'
      operationId: createAppointment
      description: "Schedule a new appointment for a patient. Automatically generates a unique token number\nand sets initial status to \"Scheduled\"."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: apt7
                  patient_name: 'John Doe'
                  patient_id: '1'
                  doctor_name: 'Dr. Lisa Cuddy'
                  doctor_id: emp1
                  treatment: 'Dental Checkup'
                  status: Scheduled
                  date: '2024-07-20'
                  time: '10:00 AM'
                  branch_id: b1
                  token_number: TABC123
                  patient:
                    id: '1'
                    name: 'John Doe'
                  doctor:
                    id: emp1
                    name: 'Dr. Lisa Cuddy'
                  branch:
                    id: b1
                    name: 'Downtown Clinic'
                properties:
                  id:
                    type: string
                    example: apt7
                  patient_name:
                    type: string
                    example: 'John Doe'
                  patient_id:
                    type: string
                    example: '1'
                  doctor_name:
                    type: string
                    example: 'Dr. Lisa Cuddy'
                  doctor_id:
                    type: string
                    example: emp1
                  treatment:
                    type: string
                    example: 'Dental Checkup'
                  status:
                    type: string
                    example: Scheduled
                  date:
                    type: string
                    example: '2024-07-20'
                  time:
                    type: string
                    example: '10:00 AM'
                  branch_id:
                    type: string
                    example: b1
                  token_number:
                    type: string
                    example: TABC123
                  patient:
                    type: object
                    properties:
                      id:
                        type: string
                        example: '1'
                      name:
                        type: string
                        example: 'John Doe'
                  doctor:
                    type: object
                    properties:
                      id:
                        type: string
                        example: emp1
                      name:
                        type: string
                        example: 'Dr. Lisa Cuddy'
                  branch:
                    type: object
                    properties:
                      id:
                        type: string
                        example: b1
                      name:
                        type: string
                        example: 'Downtown Clinic'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    patient_name:
                      - 'The patient name field is required.'
                    patient_id:
                      - 'The patient id field is required.'
                    doctor_name:
                      - 'The doctor name field is required.'
                    treatment:
                      - 'The treatment field is required.'
                    date:
                      - 'The date field is required.'
                    time:
                      - 'The time field is required.'
                    branch_id:
                      - 'The branch id field is required.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      patient_name:
                        type: array
                        example:
                          - 'The patient name field is required.'
                        items:
                          type: string
                      patient_id:
                        type: array
                        example:
                          - 'The patient id field is required.'
                        items:
                          type: string
                      doctor_name:
                        type: array
                        example:
                          - 'The doctor name field is required.'
                        items:
                          type: string
                      treatment:
                        type: array
                        example:
                          - 'The treatment field is required.'
                        items:
                          type: string
                      date:
                        type: array
                        example:
                          - 'The date field is required.'
                        items:
                          type: string
                      time:
                        type: array
                        example:
                          - 'The time field is required.'
                        items:
                          type: string
                      branch_id:
                        type: array
                        example:
                          - 'The branch id field is required.'
                        items:
                          type: string
      tags:
        - Appointments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patient_name:
                  type: string
                  description: "Patient's full name."
                  example: 'John Doe'
                  nullable: false
                patient_id:
                  type: string
                  description: "Patient's ID."
                  example: '1'
                  nullable: false
                doctor_name:
                  type: string
                  description: "Doctor's full name."
                  example: 'Dr. Lisa Cuddy'
                  nullable: false
                doctor_id:
                  type: string
                  description: "Doctor's employee ID."
                  example: emp1
                  nullable: false
                treatment:
                  type: string
                  description: 'Treatment or procedure description.'
                  example: 'Dental Checkup'
                  nullable: false
                date:
                  type: date
                  description: 'Appointment date (YYYY-MM-DD).'
                  example: '2024-07-20'
                  nullable: false
                time:
                  type: string
                  description: 'Appointment time.'
                  example: '10:00 AM'
                  nullable: false
                branch_id:
                  type: string
                  description: 'Branch ID.'
                  example: b1
                  nullable: false
              required:
                - patient_name
                - patient_id
                - doctor_name
                - doctor_id
                - treatment
                - date
                - time
                - branch_id
  '/api/appointments/{id}':
    put:
      summary: 'Update Appointment'
      operationId: updateAppointment
      description: "Update an existing appointment's details. Can update any field except the ID."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: a1
                  patient_name: 'John Doe Updated'
                  patient_id: '1'
                  doctor_name: 'Dr. Mike Chen'
                  doctor_id: emp2
                  treatment: 'Teeth Cleaning'
                  status: Completed
                  date: '2024-07-21'
                  time: '11:00 AM'
                  branch_id: b1
                  token_number: JDLC1
                  patient:
                    id: '1'
                    name: 'John Doe'
                  doctor:
                    id: emp2
                    name: 'Dr. Mike Chen'
                  branch:
                    id: b1
                    name: 'Downtown Clinic'
                properties:
                  id:
                    type: string
                    example: a1
                  patient_name:
                    type: string
                    example: 'John Doe Updated'
                  patient_id:
                    type: string
                    example: '1'
                  doctor_name:
                    type: string
                    example: 'Dr. Mike Chen'
                  doctor_id:
                    type: string
                    example: emp2
                  treatment:
                    type: string
                    example: 'Teeth Cleaning'
                  status:
                    type: string
                    example: Completed
                  date:
                    type: string
                    example: '2024-07-21'
                  time:
                    type: string
                    example: '11:00 AM'
                  branch_id:
                    type: string
                    example: b1
                  token_number:
                    type: string
                    example: JDLC1
                  patient:
                    type: object
                    properties:
                      id:
                        type: string
                        example: '1'
                      name:
                        type: string
                        example: 'John Doe'
                  doctor:
                    type: object
                    properties:
                      id:
                        type: string
                        example: emp2
                      name:
                        type: string
                        example: 'Dr. Mike Chen'
                  branch:
                    type: object
                    properties:
                      id:
                        type: string
                        example: b1
                      name:
                        type: string
                        example: 'Downtown Clinic'
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'Appointment not found'
                properties:
                  error:
